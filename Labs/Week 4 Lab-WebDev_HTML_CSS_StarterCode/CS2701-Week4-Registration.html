<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Fresh Food For All
        </title>
        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>
    <body>
        <header></header>
        <nav>
            <!-- ToDo: An unordered list to represent the menu, 
                       each list item should correspond to the menu items (Home, Register, Login, Help)
                       The css class of the menu is "navlist"
                       Check lecture slides about lists, an example of a more basic menu, and CSS class selector-->
            <ul class="navlist">
            </ul>
         </nav>
        <main>
            <!-- Check Week 4 Lecture to learn about HTML5 semantic elements-->
            <aside>
            </aside>
            


            <form class="center" novalidate>
    <label for="name">Name:</label>
    <input class="textInput" type="text" id="name" name="name">
    <br>

    <label for="email">Email:</label>
    <input class="textInput" type="text" id="email" name="email">
    <br>

    <label for="password">Password:</label>
    <input class="textInput" type="password" id="password" name="password">
    <br>

    <label for="confirmPassword">Re-type password:</label>
    <input class="textInput" type="password"
           id="confirmPassword" name="confirmPassword">
    <br>

    <input type="checkbox" id="buyer" name="buyer" value="buyer">
    <label for="buyer">I want to buy produce directly from allotment owners.</label>
    <br>

    <input type="checkbox" id="seller" name="seller" value="seller">
    <label for="seller">I want to sell produce from my allotment.</label>
    <br><br>

    <input type="checkbox" id="terms" name="terms">
    <label for="terms">
        I agree to the <a href="terms.html">Terms of Use</a>
        and <a href="privacy.html">Privacy Policy</a>.
    </label>
    <br><br>

    <button type="button"
            onclick="document.getElementById('hiddenParagraph').textContent = 'Register button clicked.';">
        Register
    </button>
    <a href="help.html">Learn more</a>
</form>



        </main>
    </body>
</html>
